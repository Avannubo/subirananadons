<script>
    document.addEventListener("DOMContentLoaded", function () {
        const darkModeToggle = document.getElementById("darkModeToggle");
        const astScrollTop = document.getElementById("ast-scroll-top");
        const darkModeButton = document.querySelector(".js-dark-mode-trigger-60987c8");
        function getThemeFromStorage() {
            return localStorage.getItem("theme-preference") === "dark";
        }
        function updateIcons() {
            const isDark = localStorage.getItem("theme-preference") === "dark";
            // Mostrar la luna cuando es dark, el sol cuando es light
            document.querySelector(".light-icon").style.display = isDark ? "none" : "block";
            document.querySelector(".dark-icon").style.display = isDark ? "block" : "none";
            astScrollTop.style.backgroundColor = isDark ? "#17426F" : "#2e2e2e";
        }
        // Al cargar la página, forzar el estado según localStorage
        setTimeout(() => {
            const isDark = getThemeFromStorage();
            if (isDark) {
                document.body.classList.add("dark-mode");
                darkModeToggle.classList.add("active");
            } else {
                document.body.classList.remove("dark-mode");
                darkModeToggle.classList.remove("active");
            }
            updateIcons();
        }, 50);
        setTimeout(() => { darkModeToggle.click(); darkModeToggle.click(); }, 10);
        // Toggle manual
        darkModeToggle.addEventListener("click", function () {
            const isDark = !getThemeFromStorage(); // invertimos manualmente
            localStorage.setItem("theme-preference", isDark ? "dark" : "light");
            document.body.classList.toggle("dark-mode", isDark);
            darkModeToggle.classList.toggle("active", isDark);
            updateIcons();
            if (darkModeButton) darkModeButton.click();
            const style = document.createElement("style");
            if (isDark) {
                style.innerHTML = `
        .swiper-pagination-bullet { background-color: #C5C6C9 !important; }
        .swiper-pagination-bullet-active { background-color: #17426F !important; }
        .post-content { color: white !important; }
		.page-numbers-dark {
			    display: inline-block!important;
			    padding: 10px 20px!important;
			    border-radius: 50px!important;
			    font-weight: 600!important;
			    text-decoration: none!important;
			    background: linear-gradient(180deg, #17426F 0%, #1E293B 100%)!important;
			    color: #FFFFFF !important;
			    transition: all 0.3s ease!important;
			}
			.page-numbers-dark:hover {
			    background: linear-gradient(180deg, #1D4C7F 0%, #25344A 100%)!important;
			    transform: translateY(-2px)!important;
			}
      `;
            } else {
                style.innerHTML = `
        .swiper-pagination-bullet { background-color: #D2CCC8 !important; }
        .swiper-pagination-bullet-active { background-color: #1E293B !important; }
        .post-content { color: #2E2E2E !important; }
		.page-numbers {
		    display: inline-block!important;
		    padding: 10px 20px!important;
		    border-radius: 50px!important;
		    font-weight: 600!important;
		    text-decoration: none!important;
		    background: linear-gradient(180deg, #7E7E7E 0%, #272727 100%)!important;
		    color: #FFFFFF !important;
		    transition: all 0.3s ease!important;
		}
		.page-numbers:hover {
		    background: linear-gradient(180deg, #6A6A6A 0%, #3E3E3E 100%)!important;
		    transform: translateY(-2px)!important;
		}
    `;
            }
            document.head.appendChild(style);
        });
    });
</script>

<style>
    .dark-icon {
        display: none;
    }

    .toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        padding: 12px;
        border-radius: 25px;
        width: 70px;
        cursor: pointer;
        position: relative;
    }

    .toggle-container svg {
        width: 24px;
        height: 24px;
        z-index: 2;
    }

    .toggle-circle {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #e4d4c7;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        left: 0px;
        transition: transform 0.3s ease, background 0.3s ease;
        z-index: 1;
    }

    .toggle-container.active .toggle-circle {
        transform: translateX(35px);
        background: #17426f;
    }

    .svg-ico {
        width: 18px !important;
    }

    .toggle-container,
    .toggle-circle,
    .toggle-container svg {
        user-select: none;
        -webkit-user-select: none;
        /* For Safari */
        -moz-user-select: none;
        /* For Firefox */
        -ms-user-select: none;
        /* For older Edge */
    }
</style>
